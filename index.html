<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Forzar siempre el tema claro: el modo oscuro del sistema no altera los colores de la app -->
  <meta name="color-scheme" content="only light">
  <meta name="supported-color-schemes" content="light">
  <meta name="theme-color" content="#FAF8F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Niskin">
  <title>Niskin Beauty Studio — Gestión Cosmetológica & Portal de Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- BARRA LATERAL (FIEL AL BOCETO 1 + LOGO NISKIN BEAUTY STUDIO) -->
    <aside class="sidebar" id="appSidebar">
      <div>
        <div class="brand-box" onclick="switchView('dashboard')" title="Ir al Panel Principal">
          <img src="assets/logo.svg" alt="Niskin Beauty Studio Logo" class="brand-logo">
        </div>

        <ul class="nav-list">
          <li>
            <button class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')">
              <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              </span>
              <span>Panel Principal</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="agenda" onclick="switchView('agenda')">
              <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
              </span>
              <span>Agenda y Citas</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="patients" onclick="switchView('patients')">
              <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 20c1.5-4 12.5-4 14 0"/><circle cx="12" cy="12" r="10"/></svg>
              </span>
              <span>Expedientes y Fotos</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="inventory" onclick="switchView('inventory')">
              <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V4h6v3"/></svg>
              </span>
              <span>Inventario</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="treatments" onclick="switchView('treatments')">
              <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4V2h6v2"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
              </span>
              <span>Protocolos y Servicios</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-view="finances" onclick="switchView('finances')">
              <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><circle cx="9" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="16" r="1"/><circle cx="12" cy="16" r="1"/><circle cx="15" cy="16" r="1"/></svg>
              </span>
              <span>Finanzas y Caja</span>
            </button>
          </li>

          <div class="nav-divider"></div>

          <li>
            <button class="nav-item portal-highlight" data-view="client-portal" onclick="switchView('client-portal')">
              <span class="nav-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
              </span>
              <span>Portal del Cliente</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="sidebar-profile">
        <div class="avatar-circle">VN</div>
        <div class="profile-meta">
          <h4>Lic. Valeria Niskin</h4>
          <p>Cosmetóloga Principal</p>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileMenu(false)"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle-btn" id="menuToggleBtn" onclick="toggleMobileMenu()" aria-label="Abrir menú" aria-controls="appSidebar" aria-expanded="false">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
          <div class="topbar-title">
            <h1 id="topbarHeading">Panel General Niskin</h1>
            <p id="topbarSubheading">Resumen ejecutivo de citas, ingresos, inventario y evolución de pacientes</p>
          </div>
        </div>

        <div class="topbar-right">
          <div class="mode-switch">
            <button id="modeAdminBtn" class="mode-btn active" onclick="switchView('dashboard')">
              💻 Estudio Admin
            </button>
            <button id="modeClientBtn" class="mode-btn" onclick="switchView('client-portal')">
              📱 App Cliente
            </button>
          </div>

          <button class="btn-soft btn-sm" onclick="openRenderConfigModal()" title="Configurar URL del Servidor Render + MongoDB">
            ☁️ <span class="btn-label">Render API</span>
          </button>

          <div class="search-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="globalSearchInput" placeholder="Buscar clienta, cita o insumo...">
          </div>

          <button class="icon-circle-btn" onclick="switchView('inventory')" title="Alertas de stock y citas">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot"></span>
          </button>

          <div class="avatar-circle topbar-avatar" style="width:38px;height:38px;cursor:pointer;" onclick="switchView('patients')" title="Ver Expedientes Clínicos">
            VN
          </div>
        </div>
      </header>

      <main id="workspaceContent" class="content-area"></main>
    </div>
  </div>

  <!-- MODAL REUTILIZABLE -->
  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="round-action-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <!-- CONTENEDOR DE NOTIFICACIONES TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
